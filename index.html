<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>I'm Sorry 🥺</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="card">

        <div class="heart">💗</div>

        <h1>I'm Sorry 🥺</h1>

        <p class="message">
            I know I made a mistake.
            <br>
            I'm genuinely sorry.
        </p>

        <p class="question">
            Will you forgive me?
        </p>

        <div class="button-area">

            <button id="yesBtn">
                Yes 💗
            </button>

            <button id="noBtn">
                No 😭
            </button>

        </div>

        <p id="response"></p>

    </main>

    <script src="script.js"></script>

</body>
</html>
